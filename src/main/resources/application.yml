server:
  forward-headers-strategy: native
  # 재배포(SIGTERM) 시 처리 중인 요청을 마치고 종료한다 — 예약·결제성 요청이 중간에 끊기지 않게
  shutdown: graceful

spring:
  application:
    name: hashi
  profiles:
    active: local
  data:
    redis:
      timeout: 3s
      connect-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  onboarding-token-ttl: 30m

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET:}   # 카카오 콘솔에서 활성화한 경우만

hashi:
  cors:
    # 콤마 구분 목록. 운영은 env CORS_ALLOWED_ORIGINS로 프론트 도메인을 주입한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # 동적 Preview 도메인만 Spring 와일드카드 패턴으로 제한해 허용한다.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  storage:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:hashi-local-uploads}
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
    presigned-url-expiration: 300s
    max-file-size: 5MB
  media:
    original-storage:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${AWS_MEDIA_ORIGINAL_BUCKET:hashi-local-media-originals}
      presigned-url-expiration: 300s
      max-file-size: 5MB
      max-files-per-request: 10

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # p95/p99 지연시간을 Grafana에서 histogram_quantile로 계산하기 위한 버킷 노출
        "[http.server.requests]": true
