spring:
  application:
    name: hashi
  profiles:
    active: local

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  onboarding-token-ttl: 30m

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET:}   # 카카오 콘솔에서 활성화한 경우만

hashi:
  cors:
    # 콤마 구분 목록. 운영은 env CORS_ALLOWED_ORIGINS로 프론트 도메인을 주입한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}