name: CD - Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: hashi-server
  IMAGE_TAG: dev
  DEPLOY_DIR: /home/ubuntu/hashi-dev

jobs:
  deploy:
    name: Build, Push, and Deploy Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "${DOCKER_TOKEN}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            -t "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Configure SSH
        env:
          DEV_EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
          DEV_EC2_SSH_KEY: ${{ secrets.DEV_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEV_EC2_SSH_KEY}" > ~/.ssh/hashi-dev.pem
          chmod 600 ~/.ssh/hashi-dev.pem
          ssh-keyscan -H "${DEV_EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Upload Docker Compose and monitoring configs
        env:
          DEV_EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
          DEV_EC2_USER: ${{ secrets.DEV_EC2_USER }}
        run: |
          EC2_USER="${DEV_EC2_USER:-ubuntu}"
          ssh -i ~/.ssh/hashi-dev.pem "${EC2_USER}@${DEV_EC2_HOST}" "mkdir -p ${DEPLOY_DIR}/docker"
          # 모니터링(prometheus·grafana) 설정 디렉토리도 함께 업로드 — compose가 상대 경로로 마운트한다
          scp -i ~/.ssh/hashi-dev.pem -r \
            docker/docker-compose.dev.yml docker/prometheus docker/grafana \
            "${EC2_USER}@${DEV_EC2_HOST}:${DEPLOY_DIR}/docker/"

      - name: Deploy to EC2
        env:
          DEV_EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
          DEV_EC2_USER: ${{ secrets.DEV_EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          EC2_USER="${DEV_EC2_USER:-ubuntu}"
          echo "${DOCKER_TOKEN}" | ssh -i ~/.ssh/hashi-dev.pem "${EC2_USER}@${DEV_EC2_HOST}" "docker login -u '${DOCKER_USERNAME}' --password-stdin"
          ssh -i ~/.ssh/hashi-dev.pem "${EC2_USER}@${DEV_EC2_HOST}" "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'EOF'
          set -euo pipefail

          cd "${DEPLOY_DIR}/docker"
          test -f ../.env.dev

          docker compose --env-file ../.env.dev -f docker-compose.dev.yml pull app
          # app 외 모니터링 서비스(prometheus·grafana)도 함께 기동 — 고정 태그 이미지는 up이 필요 시 pull한다
          docker compose --env-file ../.env.dev -f docker-compose.dev.yml up -d --remove-orphans

          for attempt in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo
              docker image prune -f
              exit 0
            fi
            echo "Waiting for application health check... (${attempt}/36)"
            sleep 5
          done

          docker ps -a
          docker logs --tail=200 hashi-dev-app || true
          exit 1
          EOF
