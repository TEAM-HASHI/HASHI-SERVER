name: CD - Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: hashi-server
  IMAGE_TAG: prod
  DEPLOY_DIR: /home/ubuntu/hashi-prod

jobs:
  deploy:
    name: Build, Push, and Deploy Prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "${DOCKER_TOKEN}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            -t "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Configure SSH
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_EC2_SSH_KEY}" > ~/.ssh/hashi-prod.pem
          chmod 600 ~/.ssh/hashi-prod.pem
          ssh-keyscan -H "${PROD_EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Upload Docker Compose and monitoring configs
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
        run: |
          EC2_USER="${PROD_EC2_USER:-ubuntu}"
          ssh -i ~/.ssh/hashi-prod.pem "${EC2_USER}@${PROD_EC2_HOST}" "mkdir -p ${DEPLOY_DIR}/docker"
          scp -i ~/.ssh/hashi-prod.pem -r \
            docker/docker-compose.prod.yml docker/prometheus docker/grafana docker/promtail docker/loki \
            "${EC2_USER}@${PROD_EC2_HOST}:${DEPLOY_DIR}/docker/"

      - name: Deploy to EC2
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          EC2_USER="${PROD_EC2_USER:-ubuntu}"
          echo "${DOCKER_TOKEN}" | ssh -i ~/.ssh/hashi-prod.pem "${EC2_USER}@${PROD_EC2_HOST}" "docker login -u '${DOCKER_USERNAME}' --password-stdin"
          ssh -i ~/.ssh/hashi-prod.pem "${EC2_USER}@${PROD_EC2_HOST}" "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'EOF'
          set -euo pipefail

          cd "${DEPLOY_DIR}/docker"
          test -f ../.env.prod

          docker compose --env-file ../.env.prod -f docker-compose.prod.yml pull app
          docker compose --env-file ../.env.prod -f docker-compose.prod.yml up -d --remove-orphans

          for attempt in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo
              docker image prune -f
              exit 0
            fi
            echo "Waiting for application health check... (${attempt}/36)"
            sleep 5
          done

          docker ps -a
          docker logs --tail=200 hashi-prod-app || true
          exit 1
          EOF
