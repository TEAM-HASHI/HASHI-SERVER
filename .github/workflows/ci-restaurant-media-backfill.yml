name: Media Backfill CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci-restaurant-media-backfill.yml"
      - "src/main/java/org/sopt/hashi/restaurant/**"
      - "src/test/java/org/sopt/hashi/restaurant/**"
      - "src/main/java/org/sopt/hashi/user/**"
      - "src/test/java/org/sopt/hashi/user/**"
      - "src/main/resources/db/migration/**"
      - "src/main/resources/application.yml"
      - "docs/media/restaurant-menu-backfill-runbook.md"
      - "docs/media/user-profile-backfill-runbook.md"
      - "docs/media/legacy-backfill-runbook.md"
      - "build.gradle"

concurrency:
  group: media-backfill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify media backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Require Docker for MySQL transaction tests
        run: docker info

      - name: Build and test exact PR source
        run: bash ./gradlew clean build --no-daemon

      - name: Require executed MySQL backfill gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = (
              "TEST-org.sopt.hashi.restaurant.migration.RestaurantMediaBackfillPersistenceIntegrationTest.xml",
              "TEST-org.sopt.hashi.user.migration.UserProfileBackfillPersistenceIntegrationTest.xml",
          )
          for name in reports:
              report = Path("build/test-results/test") / name
              suite = ET.parse(report).getroot()
              assert int(suite.attrib["tests"]) > 0, f"{name}: MySQL backfill tests did not execute"
              for outcome in ("failures", "errors", "skipped"):
                  assert int(suite.attrib[outcome]) == 0, f"{name}: {outcome} must be zero"
              print(f"{name}: executed without failures, errors, or skips")
          PY
