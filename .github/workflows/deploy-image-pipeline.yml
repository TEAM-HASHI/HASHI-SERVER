name: Deploy Image Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod
      production_confirmation:
        description: Type deploy-prod only for a production deployment
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-image-pipeline-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }} image pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: media-${{ inputs.target }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate deployment approval and configuration
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          DEPLOYMENT_REF: ${{ github.ref }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
          MEDIA_PIPELINE_STACK_NAME: ${{ vars.MEDIA_PIPELINE_STACK_NAME }}
          MEDIA_DELIVERY_BUCKET_NAME: ${{ vars.MEDIA_DELIVERY_BUCKET_NAME }}
          MEDIA_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.MEDIA_CLOUDFRONT_DISTRIBUTION_ID }}
          MEDIA_SPRING_APPLICATION_ROLE_NAME: ${{ vars.MEDIA_SPRING_APPLICATION_ROLE_NAME }}
          MEDIA_UPLOAD_ALLOWED_ORIGINS: ${{ vars.MEDIA_UPLOAD_ALLOWED_ORIGINS }}
          MEDIA_ALARM_NOTIFICATION_TOPIC_ARN: ${{ vars.MEDIA_ALARM_NOTIFICATION_TOPIC_ARN }}
          MEDIA_WORKER_EVENT_SOURCE_ENABLED: ${{ vars.MEDIA_WORKER_EVENT_SOURCE_ENABLED }}
        run: |
          set -euo pipefail

          if [[ "${TARGET}" == "prod" && "${PRODUCTION_CONFIRMATION}" != "deploy-prod" ]]; then
            echo "Production deployment requires the exact confirmation string."
            exit 1
          fi

          expected_ref="refs/heads/develop"
          if [[ "${TARGET}" == "prod" ]]; then
            expected_ref="refs/heads/main"
          fi
          if [[ "${DEPLOYMENT_REF}" != "${expected_ref}" ]]; then
            echo "${TARGET} deployments must run from ${expected_ref}."
            exit 1
          fi

          required=(
            AWS_ACCOUNT_ID
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
            AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN
            AWS_SAM_ARTIFACT_BUCKET
            MEDIA_PIPELINE_STACK_NAME
            MEDIA_DELIVERY_BUCKET_NAME
            MEDIA_CLOUDFRONT_DISTRIBUTION_ID
            MEDIA_SPRING_APPLICATION_ROLE_NAME
            MEDIA_UPLOAD_ALLOWED_ORIGINS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}"
              exit 1
            fi
          done

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]]; then
            echo "AWS_REGION is invalid."
            exit 1
          fi

          expected_role_prefix="arn:aws:iam::${AWS_ACCOUNT_ID}:role/"
          if [[ "${AWS_DEPLOY_ROLE_ARN}" != "${expected_role_prefix}"* ]]; then
            echo "AWS_DEPLOY_ROLE_ARN must be an IAM role in AWS_ACCOUNT_ID."
            exit 1
          fi
          if [[ "${AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN}" != "${expected_role_prefix}"* ]]; then
            echo "AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN must be an IAM role in AWS_ACCOUNT_ID."
            exit 1
          fi

          if [[ ! "${MEDIA_PIPELINE_STACK_NAME}" =~ ^[A-Za-z][A-Za-z0-9-]{0,127}$ ]]; then
            echo "MEDIA_PIPELINE_STACK_NAME is invalid."
            exit 1
          fi

          if [[ ! "${MEDIA_SPRING_APPLICATION_ROLE_NAME}" =~ ^[A-Za-z0-9+=,.@_-]{1,64}$ ]]; then
            echo "MEDIA_SPRING_APPLICATION_ROLE_NAME is invalid."
            exit 1
          fi

          if [[ ! "${MEDIA_CLOUDFRONT_DISTRIBUTION_ID}" =~ ^[A-Z0-9]+$ ]]; then
            echo "MEDIA_CLOUDFRONT_DISTRIBUTION_ID is invalid."
            exit 1
          fi

          if [[ "${MEDIA_UPLOAD_ALLOWED_ORIGINS}" == *"*"* ]]; then
            echo "Upload origins must be exact and cannot contain a wildcard."
            exit 1
          fi

          IFS=',' read -ra origins <<< "${MEDIA_UPLOAD_ALLOWED_ORIGINS}"
          for origin in "${origins[@]}"; do
            if [[ ! "${origin}" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
              echo "Every upload origin must be an exact HTTP(S) origin without a path."
              exit 1
            fi
            if [[ "${TARGET}" == "prod" && "${origin}" != https://* ]]; then
              echo "Production upload origins must use HTTPS."
              exit 1
            fi
          done

          worker_enabled="${MEDIA_WORKER_EVENT_SOURCE_ENABLED:-false}"
          if [[ "${worker_enabled}" != "true" && "${worker_enabled}" != "false" ]]; then
            echo "MEDIA_WORKER_EVENT_SOURCE_ENABLED must be true or false."
            exit 1
          fi

          if [[ "${TARGET}" == "prod" && -z "${MEDIA_ALARM_NOTIFICATION_TOPIC_ARN:-}" ]]; then
            echo "Production deployment requires an alarm notification topic."
            exit 1
          fi

          if [[ -n "${MEDIA_ALARM_NOTIFICATION_TOPIC_ARN:-}" ]]; then
            expected_topic_prefix="arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:"
            if [[ "${MEDIA_ALARM_NOTIFICATION_TOPIC_ARN}" != "${expected_topic_prefix}"* ]]; then
              echo "MEDIA_ALARM_NOTIFICATION_TOPIC_ARN must be in the selected account and region."
              exit 1
            fi
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: hashi-media-${{ inputs.target }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS identity and existing dependencies
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
          MEDIA_DELIVERY_BUCKET_NAME: ${{ vars.MEDIA_DELIVERY_BUCKET_NAME }}
          MEDIA_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.MEDIA_CLOUDFRONT_DISTRIBUTION_ID }}
          MEDIA_SPRING_APPLICATION_ROLE_NAME: ${{ vars.MEDIA_SPRING_APPLICATION_ROLE_NAME }}
        run: |
          set -euo pipefail

          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${caller_account}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo "OIDC credentials resolved to an unexpected AWS account."
            exit 1
          fi

          bucket_region() {
            local location
            location="$(aws s3api get-bucket-location --bucket "$1" --query LocationConstraint --output text)"
            case "${location}" in
              None|null) echo "us-east-1" ;;
              EU) echo "eu-west-1" ;;
              *) echo "${location}" ;;
            esac
          }

          verify_private_bucket() {
            local bucket="$1"
            aws s3api head-bucket --bucket "${bucket}" >/dev/null
            aws s3api get-public-access-block --bucket "${bucket}" --output json \
              | jq -e '
                  .PublicAccessBlockConfiguration
                  | .BlockPublicAcls == true
                    and .BlockPublicPolicy == true
                    and .IgnorePublicAcls == true
                    and .RestrictPublicBuckets == true
                ' >/dev/null
          }

          verify_private_bucket "${AWS_SAM_ARTIFACT_BUCKET}"
          verify_private_bucket "${MEDIA_DELIVERY_BUCKET_NAME}"

          if [[ "$(bucket_region "${AWS_SAM_ARTIFACT_BUCKET}")" != "${AWS_REGION}" ]]; then
            echo "The SAM artifact bucket must be in AWS_REGION."
            exit 1
          fi
          if [[ "$(bucket_region "${MEDIA_DELIVERY_BUCKET_NAME}")" != "${AWS_REGION}" ]]; then
            echo "The delivery bucket must be in AWS_REGION."
            exit 1
          fi

          aws iam get-role --role-name "${MEDIA_SPRING_APPLICATION_ROLE_NAME}" >/dev/null

          distribution="$(aws cloudfront get-distribution \
            --id "${MEDIA_CLOUDFRONT_DISTRIBUTION_ID}" \
            --output json)"
          jq -e --arg bucket "${MEDIA_DELIVERY_BUCKET_NAME}" '
              .Distribution.Status == "Deployed"
              and .Distribution.DistributionConfig.Enabled == true
              and (
                [
                  .Distribution.DistributionConfig.Origins.Items[]?
                  | select(
                      (
                        .DomainName == ($bucket + ".s3.amazonaws.com")
                        or (.DomainName | startswith($bucket + ".s3."))
                      )
                      and ((.OriginAccessControlId // "") != "")
                    )
                ]
                | length > 0
              )
            ' <<< "${distribution}" >/dev/null || {
              echo "CloudFront must be deployed, enabled, and use the delivery bucket through OAC."
              exit 1
            }

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/image-transform/package-lock.json

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Install and test worker
        working-directory: worker/image-transform
        run: |
          npm ci
          npm test

      - name: Build production Lambda package
        working-directory: worker/image-transform
        run: npm run package:lambda

      - name: Validate SAM template
        run: >-
          sam validate
          --lint
          --region "${{ vars.AWS_REGION }}"
          --template-file infra/media/template.yaml

      - name: Deploy SAM stack
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
          MEDIA_PIPELINE_STACK_NAME: ${{ vars.MEDIA_PIPELINE_STACK_NAME }}
          MEDIA_DELIVERY_BUCKET_NAME: ${{ vars.MEDIA_DELIVERY_BUCKET_NAME }}
          MEDIA_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.MEDIA_CLOUDFRONT_DISTRIBUTION_ID }}
          MEDIA_SPRING_APPLICATION_ROLE_NAME: ${{ vars.MEDIA_SPRING_APPLICATION_ROLE_NAME }}
          MEDIA_UPLOAD_ALLOWED_ORIGINS: ${{ vars.MEDIA_UPLOAD_ALLOWED_ORIGINS }}
          MEDIA_ALARM_NOTIFICATION_TOPIC_ARN: ${{ vars.MEDIA_ALARM_NOTIFICATION_TOPIC_ARN }}
          MEDIA_WORKER_EVENT_SOURCE_ENABLED: ${{ vars.MEDIA_WORKER_EVENT_SOURCE_ENABLED }}
        run: |
          set -euo pipefail

          parameters=(
            "EnvironmentName=${TARGET}"
            "DeliveryBucketName=${MEDIA_DELIVERY_BUCKET_NAME}"
            "CloudFrontDistributionId=${MEDIA_CLOUDFRONT_DISTRIBUTION_ID}"
            "SpringApplicationRoleName=${MEDIA_SPRING_APPLICATION_ROLE_NAME}"
            "UploadAllowedOrigins=${MEDIA_UPLOAD_ALLOWED_ORIGINS}"
            "WorkerEventSourceEnabled=${MEDIA_WORKER_EVENT_SOURCE_ENABLED:-false}"
          )
          if [[ -n "${MEDIA_ALARM_NOTIFICATION_TOPIC_ARN:-}" ]]; then
            parameters+=("AlarmNotificationTopicArn=${MEDIA_ALARM_NOTIFICATION_TOPIC_ARN}")
          fi

          sam deploy \
            --template-file infra/media/template.yaml \
            --stack-name "${MEDIA_PIPELINE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --s3-bucket "${AWS_SAM_ARTIFACT_BUCKET}" \
            --s3-prefix "media-pipeline/${TARGET}" \
            --role-arn "${AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "${parameters[@]}" \
            --tags Project=HASHI Component=media Environment="${TARGET}" ManagedBy=SAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          aws cloudformation update-termination-protection \
            --stack-name "${MEDIA_PIPELINE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --enable-termination-protection >/dev/null
