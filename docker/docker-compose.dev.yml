# 컨테이너 로그(도커 json-file) 로테이션 — 서비스당 최대 100MB(20m×5).
# 로그 보관은 Loki(30일)가 담당하고, 도커 쪽 파일은 Promtail 중단 시 따라잡기용 버퍼다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    image: ${DOCKER_USERNAME}/hashi-server:dev
    container_name: hashi-dev-app
    env_file:
      - ../.env.dev
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

      JWT_SECRET: ${JWT_SECRET}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: hashi-dev-prometheus
    restart: unless-stopped
    logging: *default-logging
    # 호스트 포트를 열지 않는다 — app 스크레이핑과 Grafana 조회 모두 도커 내부 네트워크로 처리
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hashi-dev-grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"   # 개발 팀 접속용 — 운영 환경에서는 직접 노출하지 않는다
    environment:
      # 사용자명은 admin을 기본값으로 사용하고, 비밀번호는 .env.dev에서 반드시 주입한다.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:3.1.1
    container_name: hashi-dev-loki
    restart: unless-stopped
    logging: *default-logging
    # 커스텀 설정(30일 보존) — Grafana·Promtail만 내부 네트워크로 접근, 호스트 포트 미개방
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hashi-dev-promtail
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./promtail/promtail.dev.yml:/etc/promtail/config.yml:ro
      # 도커 API로 컨테이너 로그를 수집하기 위한 소켓 (읽기 전용)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    command: -config.file=/etc/promtail/config.yml

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
