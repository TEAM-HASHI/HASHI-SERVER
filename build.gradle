plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.sopt'
version = '0.0.1-SNAPSHOT'
description = 'HASHI'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springModulithVersion', '1.4.3')
    set('springCloudAwsVersion', '3.4.2')
}

dependencies {
    // web / docs
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Geocoding: RestClient transport with explicit retry/redirect disabling (Boot-managed version).
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // 로그 JSON 인코딩(Loki 수집용) — logback-spring.xml에서 사용
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    // 컨트롤러·DTO javadoc을 Swagger description으로 자동 반영(@Operation 선언 불필요)
    implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
    annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'

    // persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // TCP_USER_TIMEOUT(리눅스 전용 소켓 옵션) 적용용 netty 네이티브 전송.
    // 운영 아키텍처 변경(예: ARM 이전)에도 epoll이 유지되도록 두 아키텍처를 모두 싣고,
    // 로드 성공 여부는 부팅 시 RedisConfig가 로그로 남긴다(조용한 NIO fallback 방지).
    runtimeOnly 'io.netty:netty-transport-native-epoll::linux-x86_64'
    runtimeOnly 'io.netty:netty-transport-native-epoll::linux-aarch_64'

    // aws
    implementation 'software.amazon.awssdk:s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'

    // validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // spring modulith (모듈 모델 + JPA 이벤트 발행 레지스트리)
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
    mainClass = 'org.sopt.hashi.HashiApplication'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    // The maintenance smoke test launches the same artifact shipped by the existing build.
    dependsOn tasks.named('bootJar')
    systemProperty 'location.maintenance.jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
    inputs.files(
            '.env.dev.example',
            'infra/media/template.yaml',
            'infra/media/parameters/dev.example.json',
            'infra/media/parameters/prod.example.json',
            '.github/workflows/ci-image-pipeline-infra.yml',
            '.github/workflows/ci-restaurant-media-backfill.yml',
            '.github/workflows/deploy-image-pipeline.yml'
    ).withPropertyName('mediaBackfillInfrastructure')
}

tasks.named('processResources') {
    from('media-specs') {
        into 'media-specs'
    }
}
